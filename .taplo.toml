# Taplo: TOML formatter (`bun run format`, the pre-commit hook, and editors via the Even Better TOML extension).
include = ["**/*.toml"]
exclude = ["node_modules/**", "data/**", "state/**", "config/**", "projects/**", "logs/**", ".lavish/**"]

[formatting]
indent_string = "    "
column_width = 120
trailing_newline = true
