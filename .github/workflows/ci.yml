name: ci

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            GITLEAKS_VERSION: 8.30.1
            GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Full history so the secrets scan covers every commit, not just the tip.
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.3.14

            - run: bun install --frozen-lockfile

            - name: Lint (tsc, Biome, guards)
              run: bun run lint

            - name: Test with coverage threshold (bunfig.toml)
              run: bun test --coverage

            - name: Secrets scan (gitleaks, full history)
              run: |
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
                  echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
                  tar -xzf "$archive" gitleaks
                  ./gitleaks git --config .gitleaks.toml --redact --no-banner
